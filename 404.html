<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Save the requested path (e.g., /advisory)
    sessionStorage.setItem('redirectPath', window.location.pathname);
    // Redirect to the main index
    window.location.replace('/'); 
  </script>
</head>
<body></body>
</html>
