<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Right Side: Form -->
    <div class="contact-right">
        <form id="investor-form">
            <div class="form-grid">
                <div class="field">
                    <label for="name">Full name *</label>
                    <input id="name" name="name" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="organisation">Organisation*</label>
                    <input id="organisation" name="organisation" autocomplete="organization" required>
                </div>
                <div class="field">
                    <label for="email">Business email *</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="country">Country*</label>
                    <input id="country" name="country" autocomplete="country-name" required>
                </div>
                <div class="field full">
                    <label for="interest">Investment interest *</label>
                    <select id="interest" name="interest" required>
                        <option value="">Select an area</option>
                        <option>Mineral exploration project</option>
                        <option>Mining investment</option>
                        <option>Strategic partnership or joint venture</option>
                        <option>Technical or investment advisory</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="field full">
                    <label for="message">Enquiry details *</label>
                    <textarea id="message" name="message" required placeholder="Briefly describe your investment interest."></textarea>
                </div>
                <div class="field full">
                    <button class="btn btn-primary" type="submit">Prepare Investor Enquiry Email ↗</button>
                </div>
            </div>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
    </div>
</body>
</html>
